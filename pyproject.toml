[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds02-rul"
version = "4.1.0"
description = "N-CMAPSS DS02 remaining-useful-life prediction: hybrid stacking ensemble"
requires-python = ">=3.12"
dependencies = [
    # Runtime environment that produced models/bilstm_ds02.keras,
    # models/ensemble.joblib and models/ds02_manifest.json. Pinned exactly
    # to the versions installed in .venv so the artifact does not carry
    # version skew. Keep in sync with requirements.txt.
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "tensorflow==2.21.0",
    "keras==3.15.1",
    "h5py==3.14.0",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "xgboost==3.4.1",
    "shap==0.54.1",
    # experiment tracking (PIA-4): text-only file store; no model binaries
    "mlflow==3.18.0",
    # notebook generation / execution
    "nbformat==5.11.1",
    "ipykernel==7.4.0",
    "jupyter-client==8.10.0",
    # demo surface
    "fastapi==0.151.0",
    "uvicorn==0.54.0",
    "streamlit==1.66.0",
    "plotly==7.1.0",
    "pydantic==2.14.1",
    "fpdf2==2.7.7",
    # tests
    "pytest==9.1.1",
    "httpx2==2.16.0",  # starlette.testclient (FastAPI tests) requires it
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = [".", "src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
# `scripts/` holds four FD001-era scripts whose names match pytest's default
# globs (recalcular_test.py, test_fixed_pipeline.py, ...). They are executable
# scripts that run a full pipeline at import time, not test modules, so a bare
# `pytest` from the repository root used to die during collection. The DS02
# suite is the only thing under `tests/`.
testpaths = ["tests"]
