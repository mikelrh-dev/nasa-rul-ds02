# DS02 mission-control theme — locked dark, one accent, high contrast.
# Colors come from here, not from CSS: native theming survives Streamlit upgrades
# and applies consistently to widgets, tables, charts and the sidebar.

[theme]
base = "dark"
primaryColor = "#0369a1"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#141d2e"
textColor = "#e8eef7"
borderColor = "#26344a"
linkColor = "#7dd3fc"
codeBackgroundColor = "#101a29"
codeTextColor = "#a5f3fc"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

baseFontSize = 15
headingFontSizes = ["2.1rem", "1.5rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
metricValueFontSize = "1.9rem"
metricValueFontWeight = 600

paddingTop = "2.5rem"
paddingBottom = "2rem"

# Categorical palette: sky → amber → emerald → violet → rose. The first two are
# the ones the fleet and the conformal band actually use.
chartCategoricalColors = ["#38bdf8", "#f59e0b", "#34d399", "#a78bfa", "#f87171", "#e2e8f0", "#64748b"]
chartSequentialColors = ["#082f49", "#0c4a6e", "#075985", "#0369a1", "#0284c7", "#0ea5e9", "#38bdf8", "#7dd3fc", "#bae6fd", "#e0f2fe"]
chartDivergingColors = ["#7f1d1d", "#b91c1c", "#ef4444", "#fca5a5", "#fecaca", "#bae6fd", "#7dd3fc", "#38bdf8", "#0284c7", "#075985"]

dataframeHeaderBackgroundColor = "#1a2437"
dataframeHeaderTextColor = "#e2e8f0"
dataframeBorderColor = "#26344a"

[theme.sidebar]
backgroundColor = "#070d18"
secondaryBackgroundColor = "#101a29"
codeBackgroundColor = "#101a29"
textColor = "#dbe6f5"
borderColor = "#1e2a3d"
primaryColor = "#0ea5e9"
linkColor = "#7dd3fc"
paddingTop = "1rem"
